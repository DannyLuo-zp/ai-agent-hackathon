name: Build and deploy AI Agent Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ROOT_NAME: ai-agent-hackathon

jobs:
  build-and-deploy-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create tag
        run: |
          echo "TAG=v$(date +%Y%m%d.%H%M%S)" >> "$GITHUB_ENV"
          echo "Using tag: ${TAG}"

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: retrieve api endpoint
        id: retrieve-api-endpoint
        run: |
          echo "API_ENDPOINT=$(az containerapp show --name $ROOT_NAME-backend -g ${{ secrets.AZURE_RESOURCE_GROUP }} --query properties.configuration.ingress.fqdn | tr -d '"')" >> "$GITHUB_ENV"

      - name: rewrite endpoint location
        run: |
          mkdir -p frontend/src/config
          echo "// This file will be overwritten during deployment" > frontend/src/config/endpoints.ts
          echo "// Default values for local development" >> frontend/src/config/endpoints.ts
          echo "export const API_ENDPOINT = 'https://$API_ENDPOINT';" >> frontend/src/config/endpoints.ts

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_ENDPOINT }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push container
        run: |
          cd frontend
          docker build . -t ${{ secrets.REGISTRY_ENDPOINT }}/$ROOT_NAME-frontend:latest --build-arg GIT_VERSION_TAG=${TAG}
          docker push ${{ secrets.REGISTRY_ENDPOINT }}/$ROOT_NAME-frontend:latest

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp up --name $ROOT_NAME-frontend \
                            --image ${{ secrets.REGISTRY_ENDPOINT }}/$ROOT_NAME-frontend:latest \
                            --ingress external \
                            --target-port 3000 \
                            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
                            --registry-server ${{ secrets.REGISTRY_ENDPOINT }} \
                            --registry-username ${{ secrets.REGISTRY_USERNAME }} \
                            --registry-password ${{ secrets.REGISTRY_PASSWORD }} \
                            --environment ${{ secrets.AZURE_CONTAINER_APP_ENV }} \
                            --env-vars "APP_VERSION=${TAG}"

          az containerapp update --name $ROOT_NAME-frontend \
                                --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
                                --min-replicas 0 \
                                --max-replicas 3 \
                                --scale-rule-name azure-http-rule \
                                --scale-rule-type http \
                                --scale-rule-http-concurrency 50

      - name: Logout
        run: |
          az logout 